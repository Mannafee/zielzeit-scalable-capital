name: Release

# Tag a version and the downloads build themselves:
#     git tag v1.0 && git push origin v1.0
#
# Note what this does NOT do: notarize. That needs a paid Apple Developer ID,
# so the artifacts are ad-hoc signed and macOS asks the user to confirm the app
# once on first launch. The README documents that step. If a Developer ID is
# ever added, sign and notarize here and the instructions can go.
on:
  # Cut releases with Scripts/release, not by pushing a tag by hand: any tag
  # matching v* lands here and publishes, and a hand-pushed tag skips the
  # appcast step entirely. The new release still becomes `latest`, so the
  # feed 404s and every existing installation — not just this release —
  # silently stops finding updates until someone notices and signs one by hand.
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history and tags: Scripts/release-notes lists the commits since
          # the previous tag, and the default shallow checkout has neither.
          fetch-depth: 0

      - name: Show toolchain
        run: swift --version

      - name: Test
        run: make test

      - name: Build universal downloads
        run: make release

      - name: Check the binary really is universal
        run: |
          archs=$(lipo -archs dist/Zielzeit.app/Contents/MacOS/Zielzeit)
          echo "architectures: $archs"
          case "$archs" in
            *x86_64*arm64*|*arm64*x86_64*) ;;
            *) echo "::error::not a universal binary ($archs)"; exit 1 ;;
          esac

      - uses: actions/upload-artifact@v4
        with:
          name: Zielzeit
          path: |
            dist/*.zip
            dist/*.dmg

      - name: Write the release notes
        if: startsWith(github.ref, 'refs/tags/')
        run: Scripts/release-notes "${GITHUB_REF_NAME}" > release-notes.md

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          # Published, not drafted. v1.1 shipped with an empty asset list because
          # the draft was left sitting and a second release was created on the
          # same tag from the GitHub UI — which is a new release, not an edit of
          # the draft, so the artifacts stayed behind on the draft. Publishing
          # here means there is no draft to strand. The gate is above: the tests
          # and the universal-binary check both have to pass before this step is
          # reached at all.
          draft: false
          files: |
            dist/*.zip
            dist/*.dmg
          # The notes are generated, not fixed text: what changed leads, and the
          # install steps — which are the same in every release — are folded away
          # underneath it. Sparkle points "what's new" at this page, so these
          # notes are what a user reads when deciding whether to update, and an
          # install guide is not that. Edit Scripts/release-notes to change the
          # shape; every release from v1.0 on already uses it.
          body_path: release-notes.md
