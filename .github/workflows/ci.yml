name: CI

# Runs on every push and pull request. Three jobs, each guarding something a
# contributor can plausibly break without noticing locally. The read-only and
# privacy claims are checked by their own workflow (audit.yml) rather than a job
# here, so the badge in the README reports that one thing and nothing else.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  # A new push supersedes the run in flight for the same branch.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - run: swift --version
      - name: Build
        run: swift build --build-tests
      - name: Test
        run: swift test

  app:
    name: App bundle and harnesses
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      # Catches packaging breakage (a missing Info.plist key, an icon that no
      # longer generates) which `swift test` cannot see.
      - name: Package the app
        run: make app

      # An end-to-end run against the synthetic CLI: no account, no network, but
      # it exercises decoding, the projection and the whole text report. This is
      # the job that catches a decoder change that compiles and passes the unit
      # tests but falls over on a full payload.
      - name: Report against the demo CLI
        run: |
          output=$(ZIELZEIT_SC_BIN=$PWD/Scripts/sc-demo ZIELZEIT_GOAL=250000 \
            ./Zielzeit.app/Contents/MacOS/Zielzeit --once)
          echo "$output"
          echo "$output" | grep -q "Your pace" || { echo "::error::no realized pace in the report"; exit 1; }
          echo "$output" | grep -q "Projections, not predictions" || { echo "::error::the disclaimer is missing"; exit 1; }

      # The exit codes --once promises, since scripts depend on them.
      - name: Exit codes
        run: |
          set +e
          ZIELZEIT_SC_BIN=/nonexistent/sc ./Zielzeit.app/Contents/MacOS/Zielzeit --once >/dev/null 2>&1
          [ $? -eq 3 ] || { echo "::error::a missing CLI should exit 3 (setup incomplete)"; exit 1; }

      # The screenshot harness renders real AppKit controls in an offscreen
      # window, which is exactly the kind of thing that rots unnoticed.
      - name: Render harnesses
        run: |
          make shots
          # `make ui` reads a goal and a portfolio, so it needs the demo CLI and a
          # goal in the environment, and there is neither a saved goal nor a session
          # on a runner.
          ZIELZEIT_SC_BIN=$PWD/Scripts/sc-demo ZIELZEIT_GOAL=250000 make ui
          for f in docs/popover.png docs/setup.png docs/menubar.png; do
            [ -s "$f" ] || { echo "::error::$f was not produced"; exit 1; }
          done

  hygiene:
    name: No real account data
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Fixtures are shaped from real CLI responses, so it is genuinely easy to
      # paste a live one in. This is the shape that would identify an account:
      # an ISIN that is not the placeholder.
      - name: Scan for account identifiers
        run: |
          status=0

          # Real ISINs are two letters, ten alphanumerics. Placeholders are
          # IE00EXAMPLE0n, which does not match the strict pattern below.
          if grep -rInE '"[A-Z]{2}[0-9]{2}[A-Z0-9]{7}[0-9]"' --include='*.swift' . \
               | grep -v 'IE00EXAMPLE'; then
            echo "::error::what looks like a real ISIN is committed"
            status=1
          fi

          if [ $status -eq 0 ]; then echo "No account identifiers found."; fi
          exit $status
