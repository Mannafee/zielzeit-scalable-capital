name: Pages

# Publishes site/ to GitHub Pages.
#
# The screenshots are NOT duplicated into site/: they live in docs/, where the
# README already points at them, and are copied into site/img/ at build time.
# One copy in git, one source of truth, and the README and the site can never
# show different screenshots.
#
# Enable once, by hand: Settings → Pages → Build and deployment → Source →
# "GitHub Actions". Without that, this workflow deploys to nothing.
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "docs/*.png"
      # The film's two artifacts. Without these a `make film` run that changed
      # only the video would not redeploy, and the site would serve the previous
      # cut until the weekly cron came round.
      - "docs/*.mp4"
      - "docs/*.jpg"
      - "Scripts/usage-badges"
      - ".github/workflows/pages.yml"
  # Weekly, so the README's downloads badge does not sit frozen between site
  # changes. It is a running total, so a missed week costs nothing but freshness.
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time, and never cancel one in flight: a half-published
# site is worse than a stale one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - name: Assemble the site
        run: |
          mkdir -p site/img
          # menubar-states.png is deliberately not copied: the site dropped the
          # states strip, and docs/ still carries it for the README.
          # social-preview.png is copied because the page's og:image points at it:
          # the card has to be served from this origin, not linked out of docs/.
          cp docs/icon.png docs/menubar.png \
             docs/popover.png docs/popover-de.png docs/popover-fr.png \
             docs/popover-es.png docs/popover-it.png docs/slider.png docs/holdings.png \
             docs/setup.png docs/setup-de.png docs/social-preview.png site/img/

      # The README's usage badges, served from the site as shields.io endpoints.
      # Non-fatal on purpose: the badges are a nicety and the site is not, so a
      # rate-limited API call must not stop the pages from publishing.
      - name: Usage badges
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: Scripts/usage-badges

      # The page loads no fonts, scripts or trackers from anyone else, and the
      # footer says so. This fails the build if that ever stops being true.
      - name: No third-party requests
        run: |
          if grep -rniE '(https?:)?//(fonts|cdn|ajax|unpkg|cdnjs|googletagmanager|google-analytics)\.' site/*.html site/*.css site/*.js; then
            echo "::error::The site claims to make no third-party requests. Something above breaks that."
            exit 1
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
